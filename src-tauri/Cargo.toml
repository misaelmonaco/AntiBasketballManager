[package]
name = "basket-manager-italia"
version = "0.1.0"
description = "Videogioco manageriale di basket europeo e italiano"
authors = ["Basket Manager Italia"]
edition = "2021"

[lib]
name = "basket_manager_italia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
